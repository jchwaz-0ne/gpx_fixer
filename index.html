<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GPX Fixer — сглаживание точек</title>

<style>

:root{
    --bg: #eef1ec;
    --card: #ffffff;
    --ink: #1c2420;
    --muted: #6b766e;
    --accent: #cf6a26;
    --accent-ink: #ffffff;
    --moss: #4c7a63;
    --line: #dde3dc;
    --error: #b5432c;
    --error-bg: #fbeae5;
    --success-bg: #eaf3e8;
    --radius: 14px;
    --mono: ui-monospace, "SFMono-Regular", "Consolas", "Menlo", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*{ box-sizing: border-box; }

html, body{ margin:0; padding:0; }

body{
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 24px 14px 40px;
}

.wrap{
    width:100%;
    max-width: 480px;
}

.card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 1px 2px rgba(20,30,24,0.06), 0 10px 30px rgba(20,30,24,0.06);
}

h1{
    font-size: 21px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
}

.sub{
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
}

label.field-label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 8px;
}

.dropzone{
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 22px 16px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
    background: #fbfbfa;
}

.dropzone:hover{ border-color: var(--moss); }

.dropzone.drag{
    border-color: var(--accent);
    background: #fdf1e6;
}

.dropzone.has-file{
    border-style: solid;
    border-color: var(--moss);
    background: #f3f8f1;
}

.dz-main{
    font-size:14px;
    font-weight:500;
}

.dz-hint{
    font-size:12px;
    color: var(--muted);
    margin-top:4px;
    word-break: break-word;
}

input[type=file]{ display:none; }

.mode-toggle{
    display:flex;
    margin-top: 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
}

.mode-btn{
    flex:1;
    padding: 10px 8px;
    border:0;
    background:#fff;
    color: var(--muted);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
}

.mode-btn + .mode-btn{ border-left:1px solid var(--line); }

.mode-btn.active{
    background: var(--moss);
    color:#fff;
}

.row{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.stepper{
    display:flex;
    align-items:center;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
    background:#fff;
    flex-shrink:0;
}

.stepper button{
    width:44px;
    height:44px;
    border:0;
    background:#fff;
    color: var(--moss);
    font-size:18px;
    cursor:pointer;
}

.stepper button:active{ background: #eef2ea; }

.stepper input{
    width:52px;
    border:0;
    text-align:center;
    font-family: var(--mono);
    font-size:16px;
    padding:8px 0;
    -moz-appearance: textfield;
}

.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.row-label{
    font-size:13px;
    line-height:1.4;
    color: var(--muted);
    flex: 1 1 160px;
}

button.primary{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition: background .15s ease;
}

button.primary:hover:not(:disabled){ background:#b85a1c; }

button.primary:disabled{
    background: #dfe3dc;
    color: #97a09a;
    cursor:not-allowed;
}

#status{ margin-top:16px; }

.panel{
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.5;
}

.panel.loading{
    background:#f1f1ee;
    color: var(--muted);
}

.panel.error{
    background: var(--error-bg);
    color: var(--error);
    border-left: 3px solid var(--error);
}

.panel.success{
    background: var(--success-bg);
    border-left: 3px solid var(--moss);
}

.readout{
    font-family: var(--mono);
    font-size:12.5px;
    margin-top:8px;
    color: var(--moss);
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.readout b{ color: var(--ink); }

.note{
    margin-top:8px;
    font-size:12.5px;
    color: var(--muted);
}

footer{
    text-align:center;
    margin-top:14px;
    font-size:12px;
    color: #8b958e;
}

@media (max-width: 400px){
    .card{ padding:18px; }
    h1{ font-size:19px; }
    .row{ gap:10px; }
    .row-label{ flex-basis: 100%; order: 2; }
    .stepper{ order: 1; }
}

</style>
</head>

<body>

<div class="wrap">

    <div class="card">

        <h1>Объединитель точек GPX</h1>

        <div class="dropzone" id="dropzone">
            <div class="dz-main" id="dzMain">Перетащите файл сюда или нажмите, чтобы выбрать</div>
            <div class="dz-hint" id="dzHint">.gpx</div>
        </div>
        <input type="file" id="file" accept=".gpx,application/gpx+xml,text/xml,application/xml">

        <div class="mode-toggle">
            <button type="button" class="mode-btn active" id="modeSeconds" data-mode="seconds">По секундам</button>
            <button type="button" class="mode-btn" id="modePoints" data-mode="points">По точкам</button>
        </div>

        <div class="row">
            <div class="stepper">
                <button type="button" id="secMinus" aria-label="меньше">−</button>
                <input type="number" id="amount" value="5" min="1" inputmode="numeric">
                <button type="button" id="secPlus" aria-label="больше">+</button>
            </div>
            <div class="row-label" id="modeLabel">Объединять точки чаще, чем раз в N секунд</div>
        </div>

        <button class="primary" id="processBtn" disabled>Обработать и скачать</button>

        <div id="status"></div>

    </div>
</div>

<script>

const GPXTPX_NS = "http://www.garmin.com/xmlschemas/TrackPointExtension/v1";
const GPX_NS = "http://www.topografix.com/GPX/1/1";

// canonical field -> accepted local-name spellings found across different exporters
const FIELD_ALIASES = {
    hr:    ["hr", "heartrate", "heartratebpm"],
    cad:   ["cad", "cadence"],
    atemp: ["atemp", "temp", "temperature"],
    power: ["power", "pwr"]
};
const EXT_FIELDS = Object.keys(FIELD_ALIASES);

const dropzone = document.getElementById("dropzone");
const dzMain = document.getElementById("dzMain");
const dzHint = document.getElementById("dzHint");
const fileInput = document.getElementById("file");
const amountInput = document.getElementById("amount");
const processBtn = document.getElementById("processBtn");
const status = document.getElementById("status");
const modeSecondsBtn = document.getElementById("modeSeconds");
const modePointsBtn = document.getElementById("modePoints");
const modeLabel = document.getElementById("modeLabel");

let selectedFile = null;
let mode = "seconds"; // "seconds" | "points"

const MODE_TEXT = {
    seconds: "Объединять точки чаще, чем раз в N секунд",
    points: "Объединять каждые N точек в одну"
};

function setMode(newMode){
    mode = newMode;
    modeSecondsBtn.classList.toggle("active", mode === "seconds");
    modePointsBtn.classList.toggle("active", mode === "points");
    modeLabel.textContent = MODE_TEXT[mode];
}

modeSecondsBtn.addEventListener("click", () => setMode("seconds"));
modePointsBtn.addEventListener("click", () => setMode("points"));

// --- dropzone interactions ---

dropzone.addEventListener("click", () => fileInput.click());

dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("drag");
});

dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));

dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelected(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener("change", () => {
    if (fileInput.files.length) handleFileSelected(fileInput.files[0]);
});

document.getElementById("secMinus").addEventListener("click", () => {
    amountInput.value = Math.max(1, (Number(amountInput.value) || 1) - 1);
});
document.getElementById("secPlus").addEventListener("click", () => {
    amountInput.value = (Number(amountInput.value) || 1) + 1;
});
amountInput.addEventListener("input", () => {
    if (!amountInput.value || Number(amountInput.value) < 1) amountInput.value = 1;
});

async function handleFileSelected(file){
    selectedFile = file;
    status.innerHTML = "";
    dropzone.classList.add("has-file");
    dzMain.textContent = file.name;
    dzHint.textContent = formatBytes(file.size);
    processBtn.disabled = true;

    try{
        const text = await readAsText(file);
        const info = quickInspect(text);
        if (info.error){
            showPanel("error", info.error);
            return;
        }
        dzHint.textContent = formatBytes(file.size) + " · " + info.summary;
        processBtn.disabled = false;
    } catch(err){
        showPanel("error", "Не удалось прочитать файл: " + escapeHTML(err.message));
    }
}

function formatBytes(n){
    if (n < 1024) return n + " Б";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " КБ";
    return (n / 1024 / 1024).toFixed(2) + " МБ";
}

function readAsText(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("ошибка чтения"));
        reader.readAsText(file, "UTF-8");
    });
}

function stripBOM(text){
    return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
}

function parseXML(text){
    const parser = new DOMParser();
    const doc = parser.parseFromString(stripBOM(text), "application/xml");
    const err = doc.getElementsByTagName("parsererror")[0];
    if (err) return { doc: null, error: "Файл повреждён или это не корректный XML/GPX." };
    if (!doc.documentElement || doc.documentElement.localName.toLowerCase() !== "gpx"){
        return { doc: null, error: "В файле не найден корневой элемент <gpx>. Похоже, это не GPX-файл." };
    }
    return { doc, error: null };
}

function quickInspect(text){
    const { doc, error } = parseXML(text);
    if (error) return { error };
    const trkpt = doc.getElementsByTagName("trkpt").length;
    const trk = doc.getElementsByTagName("trk").length;
    const wpt = doc.getElementsByTagName("wpt").length;
    const rte = doc.getElementsByTagName("rte").length;
    if (trkpt === 0 && wpt === 0 && rte === 0){
        return { error: "В файле не найдено ни точек трека, ни точек маршрута — нечего обрабатывать." };
    }
    const parts = [];
    if (trkpt) parts.push(trkpt + " точек, " + trk + " трек(ов)");
    if (wpt) parts.push(wpt + " путевых точек");
    if (rte) parts.push(rte + " маршрутов");
    return { summary: parts.join(" · ") };
}

function showPanel(type, html){
    status.innerHTML = '<div class="panel ' + type + '">' + html + '</div>';
}

// --- main action ---

processBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    const amount = Math.max(1, Number(amountInput.value) || 5);
    processBtn.disabled = true;
    showPanel("loading", "Обработка…");

    try{
        const rawText = await readAsText(selectedFile);
        const { doc, error } = parseXML(rawText);
        if (error){
            showPanel("error", error);
            processBtn.disabled = false;
            return;
        }

        const { xml, stats } = fixGPX(doc, mode, amount);
        const outName = buildOutputName(selectedFile.name, amount, mode);
        download(outName, xml);

        let html = "Готово! Файл <b>" + escapeHTML(outName) + "</b> скачан.";
        html += '<div class="readout">';
        html += "<span>точек: <b>" + stats.pointsIn + "</b> → <b>" + stats.pointsOut + "</b> (−" + stats.reduction + "%)</span>";
        if (stats.tracks > 1) html += "<span>треков: <b>" + stats.tracks + "</b></span>";
        if (stats.skipped) html += "<span>пропущено некорректных: <b>" + stats.skipped + "</b></span>";
        html += "</div>";
        if (stats.noTimeSegments && mode === "seconds"){
            html += '<div class="note">В части точек нет метки времени — там усреднение не применялось, эти точки перенесены как есть.</div>';
        }
        showPanel("success", html);
        processBtn.disabled = false;

    } catch(err){
        showPanel("error", "Не удалось обработать файл: " + escapeHTML(err.message));
        processBtn.disabled = false;
    }
});

function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function escapeXML(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// --- build output filename: insert the grouping value right before the extension ---
function buildOutputName(originalName, amount, mode){
    const dot = originalName.lastIndexOf(".");
    const base = dot > -1 ? originalName.slice(0, dot) : originalName;
    const ext = dot > -1 ? originalName.slice(dot) : ".gpx";
    const suffix = mode === "points" ? amount + "pt" : amount + "s";
    return "fixed_" + base + "_" + suffix + ext;
}

// --- number parsing tolerant of stray whitespace and comma decimals ---
function toNumber(raw){
    if (raw === null || raw === undefined) return NaN;
    const cleaned = String(raw).trim().replace(",", ".");
    return cleaned === "" ? NaN : Number(cleaned);
}

// --- GPX processing ---

function fixGPX(doc, mode, amount){

    const stats = { pointsIn: 0, pointsOut: 0, reduction: 0, tracks: 0, skipped: 0, noTimeSegments: false };

    const metadataName = getText(doc.documentElement, "metadata", "name");

    // pass through waypoints and routes untouched
    const wptNodes = [...doc.getElementsByTagName("wpt")];
    const rteNodes = [...doc.getElementsByTagName("rte")];
    const serializer = new XMLSerializer();
    const passthrough = [...wptNodes, ...rteNodes].map(n => serializer.serializeToString(n));

    let trkNodes = [...doc.getElementsByTagName("trk")];

    // fallback: loose trkpt with no surrounding <trk>/<trkseg>
    if (trkNodes.length === 0){
        const looseTrkpt = [...doc.getElementsByTagName("trkpt")];
        if (looseTrkpt.length){
            trkNodes = [{ synthetic: true, points: looseTrkpt }];
        }
    }

    stats.tracks = trkNodes.length;

    const trackBlocks = trkNodes.map(trk => {
        const name = trk.synthetic ? null : getText(trk, null, "name");
        const segs = trk.synthetic
            ? [trk.points]
            : [...trk.getElementsByTagName("trkseg")].map(seg => [...seg.getElementsByTagName("trkpt")]);
        const segsToUse = segs.length ? segs : [[...trk.getElementsByTagName("trkpt")]];

        const outSegs = segsToUse.map(trkptNodes => {
            const points = [];
            for (const node of trkptNodes){
                const lat = toNumber(node.getAttribute("lat"));
                const lon = toNumber(node.getAttribute("lon"));
                if (!isFinite(lat) || !isFinite(lon)){
                    stats.skipped++;
                    continue;
                }
                const timeText = getText(node, null, "time");
                const eleText = getText(node, null, "ele");
                const point = {
                    lat, lon,
                    time: timeText || null,
                    ele: eleText !== null ? toNumber(eleText) : null
                };
                for (const field of EXT_FIELDS){
                    const v = getTextAny(node, FIELD_ALIASES[field]);
                    point[field] = v !== null ? toNumber(v) : null;
                }
                points.push(point);
            }
            stats.pointsIn += points.length;
            const smoothed = mode === "points" ? smoothByCount(points, amount) : smoothByTime(points, amount);
            stats.pointsOut += smoothed.length;
            if (mode === "seconds" && points.some(p => !p.time)) stats.noTimeSegments = true;
            return smoothed;
        });

        return { name, segs: outSegs };
    });

    stats.reduction = stats.pointsIn ? Math.round((1 - stats.pointsOut / stats.pointsIn) * 100) : 0;

    const xml = createGPX(trackBlocks, passthrough, metadataName);
    return { xml, stats };
}

function getText(scopeEl, childTagName, targetLocalName){
    const root = childTagName ? [...scopeEl.getElementsByTagName(childTagName)][0] : scopeEl;
    if (!root) return null;
    const found = findNode(root, targetLocalName);
    return found ? found.textContent.trim() : null;
}

function getTextAny(scopeEl, targetLocalNames){
    const found = findNodeAny(scopeEl, targetLocalNames);
    return found ? found.textContent.trim() : null;
}

function findNode(el, name){
    if (el.localName && el.localName.toLowerCase() === name) return el;
    for (const child of el.children){
        const r = findNode(child, name);
        if (r) return r;
    }
    return null;
}

function findNodeAny(el, names){
    if (el.localName && names.includes(el.localName.toLowerCase())) return el;
    for (const child of el.children){
        const r = findNodeAny(child, names);
        if (r) return r;
    }
    return null;
}

// group points that fall within the same rolling time window
function smoothByTime(points, averageSeconds){
    const result = [];
    let group = [];
    let groupStart = null;

    for (const p of points){
        const ms = p.time ? new Date(p.time).getTime() : NaN;
        const validTime = !isNaN(ms);

        if (!validTime){
            if (group.length){ result.push(averagePoint(group)); group = []; groupStart = null; }
            result.push(p);
            continue;
        }

        if (groupStart === null){
            groupStart = ms;
            group = [p];
            continue;
        }

        if (ms - groupStart <= averageSeconds * 1000){
            group.push(p);
        } else {
            result.push(averagePoint(group));
            group = [p];
            groupStart = ms;
        }
    }

    if (group.length) result.push(averagePoint(group));
    return result;
}

// group every N consecutive points regardless of their timestamps
function smoothByCount(points, groupSize){
    const size = Math.max(1, Math.round(groupSize));
    const result = [];
    for (let i = 0; i < points.length; i += size){
        result.push(averagePoint(points.slice(i, i + size)));
    }
    return result;
}

function averagePoint(arr){
    let lat = 0, lon = 0;
    const sums = {}, counts = {};
    for (const f of EXT_FIELDS){ sums[f] = 0; counts[f] = 0; }
    let ele = 0, eleCount = 0;

    for (const p of arr){
        lat += p.lat;
        lon += p.lon;
        if (p.ele !== null && !isNaN(p.ele)){ ele += p.ele; eleCount++; }
        for (const f of EXT_FIELDS){
            if (p[f] !== null && !isNaN(p[f])){ sums[f] += p[f]; counts[f]++; }
        }
    }

    const out = {
        lat: lat / arr.length,
        lon: lon / arr.length,
        time: arr[0].time,
        ele: eleCount ? ele / eleCount : null
    };
    for (const f of EXT_FIELDS){
        out[f] = counts[f] ? Math.round(sums[f] / counts[f]) : null;
    }
    return out;
}

function createGPX(trackBlocks, passthrough, metadataName){
    let out = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GPX Fixer" xmlns="' + GPX_NS + '" xmlns:gpxtpx="' + GPXTPX_NS + '">\n';

    if (metadataName){
        out += "<metadata><name>" + escapeXML(metadataName) + "</name></metadata>\n";
    }

    for (const block of passthrough){
        out += block + "\n";
    }

    for (const { name, segs } of trackBlocks){
        out += "<trk>\n";
        if (name) out += "<name>" + escapeXML(name) + "</name>\n";
        for (const points of segs){
            out += "<trkseg>\n";
            for (const p of points){
                out += '<trkpt lat="' + p.lat.toFixed(8) + '" lon="' + p.lon.toFixed(8) + '">\n';
                if (p.ele !== null && !isNaN(p.ele)) out += "<ele>" + p.ele.toFixed(2) + "</ele>\n";
                if (p.time) out += "<time>" + escapeXML(p.time) + "</time>\n";
                const extFields = EXT_FIELDS.filter(f => p[f] !== null && !isNaN(p[f]));
                if (extFields.length){
                    out += "<extensions>\n<gpxtpx:TrackPointExtension>\n";
                    for (const f of extFields){
                        out += "<gpxtpx:" + f + ">" + p[f] + "</gpxtpx:" + f + ">\n";
                    }
                    out += "</gpxtpx:TrackPointExtension>\n</extensions>\n";
                }
                out += "</trkpt>\n";
            }
            out += "</trkseg>\n";
        }
        out += "</trk>\n";
    }

    out += "</gpx>";
    return out;
}

function download(filename, data){
    const blob = new Blob([data], { type: "application/gpx+xml" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

</script>

</body>
</html>
